[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "manufai-bridge"
version = "0.1.0"
description = "ManufAI factory bridge: outbound-only link between the server and CNC machines"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7,<3",
  "pyyaml>=6",
  "websockets>=12",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "ruff>=0.6",
  "black>=24",
  "mypy>=1.10",
  "types-PyYAML",
]

[project.scripts]
manufai-bridge = "bridge.main:main"

[tool.setuptools.packages.find]
include = ["bridge*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "S", "SIM"]
ignore = ["S101", "N818", "N812"]  # N818: names from the build plan; N812: `ctypes as C`

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S107", "S108", "E741"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
