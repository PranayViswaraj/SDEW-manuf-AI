[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "manufai-server"
version = "0.1.0"
description = "ManufAI cloud server (FastAPI)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.13",
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.3",
  "psycopg[binary]>=3.1",
  "pyjwt>=2.8",
  "argon2-cffi>=23.1",
  "python-multipart>=0.0.9",
  "openpyxl>=3.1",
]

[project.optional-dependencies]
# AI drawing reader (MANUFAI_AI_READER=claude). Not needed while the reader is off.
ai = ["anthropic>=2.12,<3", "pypdfium2>=4.30,<6", "pillow>=10.4"]
dev = [
  "pytest>=8",
  "httpx>=0.27",
  "types-openpyxl",
  "ruff>=0.6",
  "black>=24",
  "mypy>=1.10",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::pytest.PytestDeprecationWarning:pytest_asyncio.*"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "S", "SIM"]
ignore = ["S101", "N818"]  # S101: assert in tests; N818: exception names read better without "Error"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S107", "S108", "E741"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Body", "fastapi.File", "fastapi.Form", "app.auth.deps.require_roles"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["app/db/migrations/"]

# Imaging for the AI reader (optional extra "ai"): may be missing where the reader is off.
[[tool.mypy.overrides]]
module = ["PIL", "PIL.*", "pypdfium2", "pypdfium2.*"]
ignore_missing_imports = true
