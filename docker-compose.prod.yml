# PRODUCTION stack: PostgreSQL + ManufAI server + web (Caddy, automatic HTTPS).
#
#   cp .env.prod.example .env.prod     # fill in every value
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
#   docker compose -f docker-compose.prod.yml --env-file .env.prod exec server python -m app.cli check
#
# No dev users, no simulated bridge, database not exposed outside the Docker network.
name: manufai-prod

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-manufai}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  server:
    build: ./server
    restart: unless-stopped
    environment:
      MANUFAI_ENV: production
      MANUFAI_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-manufai}
      MANUFAI_JWT_SECRET: ${MANUFAI_JWT_SECRET:?set MANUFAI_JWT_SECRET}
      MANUFAI_CORS_ORIGINS: ${MANUFAI_CORS_ORIGINS:?set MANUFAI_CORS_ORIGINS}
      MANUFAI_SEED_DEV_DATA: "false"
      MANUFAI_LOG_JSON: "true"
      MANUFAI_LOG_LEVEL: ${MANUFAI_LOG_LEVEL:-INFO}
      MANUFAI_DOCS_ENABLED: ${MANUFAI_DOCS_ENABLED:-false}
      MANUFAI_HSTS: ${MANUFAI_HSTS:-true}
      MANUFAI_SAMPLES_DIR: /samples/programs
    volumes:
      - ./samples/programs:/samples/programs:ro
      # Values read from known drawings (autofill on upload). Same parent folder as programs.
      - ./samples/drawings:/samples/drawings:ro
    depends_on:
      db:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

  web:
    build:
      context: ./web
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    environment:
      MANUFAI_DOMAIN: ${MANUFAI_DOMAIN:-:80}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      server:
        condition: service_healthy

volumes:
  pgdata:
  caddy_data:
  caddy_config:
