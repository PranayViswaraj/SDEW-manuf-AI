# Publishes the web app to GitHub Pages: https://pranayviswaraj.github.io/SDEW-manuf-AI/
#
# Free, no server to pay for: by default the ManufAI Python server runs inside each visitor's
# browser (Pyodide, see web/browser-server/), with its data saved in that browser.
# To use a real shared server instead, set the repository variable API_BASE
# (Settings > Secrets and variables > Actions > Variables), e.g. https://manufai-server.onrender.com
name: Deploy web app to GitHub Pages

on:
  push:
    branches: [main]
    paths: ['web/**', 'server/app/**', 'samples/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: python3 web/browser-server/pack.py
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
          VITE_API_BASE: ${{ vars.API_BASE }}
          VITE_BROWSER_SERVER: ${{ vars.API_BASE == '' && '1' || '0' }}
      # Pages has no server-side routing: serve the app for every path (e.g. /programs/12).
      - run: cp web/dist/index.html web/dist/404.html && touch web/dist/.nojekyll
      - name: Publish to the gh-pages branch
        working-directory: web/dist
        run: |
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publish web app from ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
