# Local development stack: PostgreSQL + FastAPI server + Vite web.
# Usage:  cp .env.example .env   (optional - defaults below work)
#         docker compose up --build
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-manufai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-manufai}
      POSTGRES_DB: ${POSTGRES_DB:-manufai}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-manufai} -d ${POSTGRES_DB:-manufai}"]
      interval: 3s
      timeout: 3s
      retries: 20

  server:
    build: ./server
    environment:
      MANUFAI_ENV: ${MANUFAI_ENV:-dev}
      MANUFAI_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-manufai}:${POSTGRES_PASSWORD:-manufai}@db:5432/${POSTGRES_DB:-manufai}
      MANUFAI_JWT_SECRET: ${MANUFAI_JWT_SECRET:-dev-only-insecure-secret-change-me-in-prod}
      MANUFAI_CORS_ORIGINS: ${MANUFAI_CORS_ORIGINS:-http://localhost:5173}
      # Off by default: only the real LMW Lathe 1 and the 5 trusted programs are created.
      # Demo mode (dev users with public passwords, SIM Lathe, sample data):
      #   MANUFAI_SEED_DEV_DATA=true docker compose --profile demo up --build
      MANUFAI_SEED_DEV_DATA: ${MANUFAI_SEED_DEV_DATA:-false}
      MANUFAI_SAMPLES_DIR: /samples/programs
      MANUFAI_SAMPLE_MATERIALS_CSV: /samples/materials/raw-material-register.sample.csv
    volumes:
      - ./samples:/samples:ro
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${SERVER_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 5s
      timeout: 3s
      retries: 20

  # DEMO ONLY: bridge with SIMULATED machines. Starts only with --profile demo.
  bridge:
    build: ./bridge
    profiles: ["demo"]
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped

  web:
    build: ./web
    environment:
      VITE_API_PROXY_TARGET: http://server:8000
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-5173}:5173"

volumes:
  pgdata:
